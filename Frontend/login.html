<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Login - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container">
  <h2>User Login</h2>
  <p class="subtitle">Access your parking bookings and reserve slots easily.</p>

  <form id="login-form">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" value="smriti@example.com" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" value="password123" placeholder="Enter your password" required>
    </div>

    <button type="submit" class="btn" style="width: 100%;">Sign In to Book Slots</button>
  </form>

  <p class="small-note">Don't have an account yet? <a href="register.html">Create a free account</a></p>
  <p class="small-note" style="margin-top: 10px;">Are you a system administrator? <a href="admin-login.html">Login as Admin</a></p>
</div>

</html>
