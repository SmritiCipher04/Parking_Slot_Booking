<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Account - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container">
  <h2>Create an Account</h2>
  <p class="subtitle">Join ExcuseME to search and reserve parking slots online.</p>

  <form id="register-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="name@example.com" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a strong password" required>
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter password" required>
    </div>

    <button type="submit" class="btn" style="width: 100%;">Create Free Account</button>
  </form>

  <p class="small-note">Already have an account? <a href="login.html">Log in here</a></p>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/register-page.js"></script>
</body>
</html>
