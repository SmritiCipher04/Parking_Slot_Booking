<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Account - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container">
  <h2>Create Your Account</h2>
  <p class="subtitle">Register to reserve parking slots across top locations</p>

  <form id="register-form">
    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email address" required>
    </div>

    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" placeholder="Enter 10-digit mobile number" required>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Create a password (min 4 chars)" required>
        <button type="button" class="toggle-password-btn" data-target="password" title="Show password">👁️</button>
      </div>
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirm Password</label>
      <div class="password-wrapper">
        <input type="password" id="confirm-password" placeholder="Re-enter password" required>
        <button type="button" class="toggle-password-btn" data-target="confirm-password" title="Show password">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn" style="width: 100%;">Register & Sign In</button>
  </form>

  <p class="small-note">Already have an account? <a href="login.html">Login here</a></p>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/password-toggle.js"></script>
<script src="js/register-page.js"></script>
</body>
</html>
