<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container">
  <h2>🛡️ Admin Portal Authentication</h2>
  <p class="subtitle">System administrator login for location management and revenue analytics.</p>

  <form id="admin-login-form">
    <div class="form-group">
      <label for="admin-email">Admin Email / ID</label>
      <input type="text" id="admin-email" value="admin@excuseme.com" placeholder="admin@excuseme.com" required>
    </div>

    <div class="form-group">
      <label for="admin-password">Password</label>
      <input type="password" id="admin-password" value="adminpassword" placeholder="Enter admin password" required>
    </div>

    <button type="submit" class="btn" style="width: 100%; background-color: var(--text-primary);">
      🔑 Login to Admin Control Panel
    </button>
  </form>

  <p class="small-note" style="margin-top: 20px;">Return to regular <a href="login.html">User Portal Login</a></p>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/admin-login-page.js"></script>
</body>
</html>
