<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container">
  <h2>🛡️ Admin Portal Login</h2>
  <p class="subtitle">Authenticate with your self-created admin username and password.</p>

  <div id="unconfigured-notice" style="display: none; background-color: var(--primary-light); border: 1px solid var(--border-focus); padding: 16px; border-radius: 8px; margin-bottom: 20px; font-size: 14px;">
    <strong>Initial Setup Required:</strong> No admin account has been created yet.
    <div style="margin-top: 10px;">
      <a href="admin-setup.html" class="btn btn-sm">⚙️ Perform One-Time Admin Setup</a>
    </div>
  </div>

  <form id="admin-login-form">
    <div class="form-group">
      <label for="admin-email">Admin Username</label>
      <input type="text" id="admin-email" placeholder="Enter admin username" required>
    </div>

    <div class="form-group">
      <label for="admin-password">Password</label>
      <div class="password-wrapper">
        <input type="password" id="admin-password" placeholder="Enter admin password" required>
        <button type="button" class="toggle-password-btn" data-target="admin-password" title="Show password">👁️</button>
      </div>
    </div>

    <button type="submit" class="btn" style="width: 100%; background-color: var(--text-primary);">
      🔑 Login to Admin Control Panel
    </button>
  </form>

  <p class="small-note" style="margin-top: 20px;">Return to regular <a href="login.html">User Portal Login</a></p>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/password-toggle.js"></script>
<script src="js/admin-login-page.js"></script>
</body>
</html>
