<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container main-content" style="max-width: 600px;">
  <div style="background-color: var(--card-bg); padding: 32px; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); border: 1px solid var(--border-color);">
    <h2>👤 User Profile</h2>
    <p class="subtitle" style="margin-bottom: 24px;">Manage your account details and security credentials</p>

    <form id="profile-form">
      <div class="form-group">
        <label for="prof-name">Full Name</label>
        <input type="text" id="prof-name" required>
      </div>

      <div class="form-group">
        <label for="prof-email">Email Address (Read-Only)</label>
        <input type="email" id="prof-email" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
      </div>

      <div class="form-group">
        <label for="prof-phone">Phone Number</label>
        <input type="tel" id="prof-phone" required>
      </div>

      <button type="submit" class="btn" style="width: 100%; margin-bottom: 24px;">Save Profile Changes</button>
    </form>

    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 24px 0;">

    <h3>🔒 Change Password</h3>
    <p class="subtitle" style="font-size: 13px; margin-bottom: 16px;">Update your password stored in MongoDB Atlas.</p>

    <form id="change-password-form">
      <div class="form-group">
        <label for="current-password">Current Password</label>
        <div class="password-wrapper">
          <input type="password" id="current-password" placeholder="Enter current password" required>
          <button type="button" class="toggle-password-btn" data-target="current-password" title="Show password">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="new-password">New Password</label>
        <div class="password-wrapper">
          <input type="password" id="new-password" placeholder="Enter new password (min 4 chars)" required>
          <button type="button" class="toggle-password-btn" data-target="new-password" title="Show password">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn btn-secondary" style="width: 100%;">Update Password</button>
    </form>

    <hr style="border: none; border-top: 1px solid var(--border-color); margin: 24px 0;">

    <button id="logout-btn" class="btn btn-danger" style="width: 100%;">Logout of Account</button>
  </div>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/config.js"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/password-toggle.js"></script>
<script src="js/profile-page.js"></script>
</body>
</html>
