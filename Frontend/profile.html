<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Profile - ExcuseME Parking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header></header>

<div class="container auth-container" style="max-width: 540px;">
  <h2>User Account & Profile</h2>
  <p class="subtitle">View and edit your personal account details.</p>

  <form id="profile-form">
    <div class="form-group">
      <label for="prof-name">Full Name</label>
      <input type="text" id="prof-name" name="name" required>
    </div>

    <div class="form-group">
      <label for="prof-email">Email Address (Account ID)</label>
      <input type="email" id="prof-email" name="email" readonly style="background-color: #f1f5f9; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label for="prof-phone">Phone Number</label>
      <input type="tel" id="prof-phone" name="phone" required>
    </div>

    <button type="submit" class="btn" style="width: 100%;">💾 Save Profile Changes</button>
  </form>

  <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; text-align: center;">
    <button id="logout-btn" class="btn btn-secondary" style="color: #ef4444; border-color: #fecaca;">
      🚪 Sign Out of Account
    </button>
  </div>
</div>

<footer>
  &copy; 2026 Parking Slot Booking System | Smriti Sarkar | ADTU/1/2024-28/BCSS/158
</footer>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/profile-page.js"></script>
</body>
</html>
